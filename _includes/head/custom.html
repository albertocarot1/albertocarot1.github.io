{% unless site.twitter.username %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape_once }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape_once }}">
<meta name="twitter:image" content="{{ site.og_image | absolute_url | escape }}">
<meta name="twitter:image:alt" content="{{ site.og_image_alt | escape }}">
{% endunless %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<script>
	document.addEventListener("click", function (event) {
		var link = event.target.closest("nav.toc a[href^='#']");
		if (!link) return;

		var target = document.getElementById(link.hash.slice(1));
		if (!target) return;

		event.preventDefault();
		event.stopImmediatePropagation();

		var offset = parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0;
		var targetTop = target.getBoundingClientRect().top + window.pageYOffset - offset;
		window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
		history.pushState(null, "", link.hash);
	}, true);
</script>
