name: Update media

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch public media feeds
        id: fetch
        run: |
          python3 scripts/fetch_media.py || result=$?
          echo "exit_code=${result:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit updated feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- _data
          if git diff --cached --quiet; then
            echo "No media data changed."
            exit 0
          fi
          git commit -m "Update media feeds"
          git push

      - name: Report feed failures
        if: steps.fetch.outputs.exit_code != '0'
        run: exit 1
