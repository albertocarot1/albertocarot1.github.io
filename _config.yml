# Alberto Caroli – Musician, Producer, Sound Engineer
title: "Alberto Caroli"
url: "https://www.albertocaroli.com"
email:
description: >-
  Musician, Producer and Sound Engineer based in Italy.
  Drummer, producer, mixing and mastering engineer.
og_image: "/assets/images/og-default.jpg"
og_image_alt: "Alberto Caroli playing drums"
# TODO(alberto): supply a 1200x630 photo of Alberto at the kit for this social sharing image.

minimal_mistakes_skin: "dark"
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
timezone: Europe/Rome

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

author:
  name: "Alberto Caroli"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Drummer · Producer · Sound Engineer"
  links:
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      # TODO(alberto): provide the correct YouTube channel URL.
      url: ""
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://www.facebook.com/albertocaroli"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/albe.caroli"

footer:
  links:
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      # TODO(alberto): provide the correct YouTube channel URL.
      url: ""
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://facebook.com/albertocaroli"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/albe.caroli"

atom_feed:
  hide: true

defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: splash
      author_profile: true
